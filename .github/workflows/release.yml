name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build universal app and run offline tests
        env:
          RESETCARDBAR_ARCH: universal
          RESETCARDBAR_BUNDLE_CODEX: 1
        run: make test
      - name: Check release signing secret
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: test -n "$SPARKLE_PRIVATE_KEY"
      - name: Package and sign update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > build/release-status.txt 2>/dev/null; then
            test "$(cat build/release-status.txt)" = true
            gh release upload "$GITHUB_REF_NAME" "dist/ResetCardBar-"*.zip "dist/ResetCardBar-"*.dmg dist/appcast.xml dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/ResetCardBar-"*.zip "dist/ResetCardBar-"*.dmg \
              dist/appcast.xml dist/SHA256SUMS --draft \
              --verify-tag --title "ResetCardBar $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
